# Pinstripe's pipeline, built from the Preflight components on this GitLab.
# Pinned to Preflight 0.13.0. Never use ~latest.
# Pinstripe requires PHP ^8.3, so the test matrix starts at 8.3. The tests run
# Pint and PHPStan on fixtures, so a green php-test means the presets work.
# composer ci is the contract: every check runs from the "ci" script in composer.json.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit.
# D-176 pipeline shape: branch pipelines only, a new commit cancels the old pipeline,
# pushes run the fast tier, nightly schedules, tags and manual runs the full tier.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
      variables: { PREFLIGHT_TIER: full }
    - if: $CI_PIPELINE_SOURCE == "schedule" && $PREFLIGHT_TIER == "full"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables: { PREFLIGHT_TIER: fast }
    - if: $CI_PIPELINE_SOURCE == "web"
      variables: { PREFLIGHT_TIER: full }
    - if: $CI_COMMIT_BRANCH
      variables: { PREFLIGHT_TIER: fast }
default:
  interruptible: true
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.13.0
    inputs:
      tier: full
      php_versions: ["8.3", "8.4", "8.5"]
      image: "php:${PHP_VERSION}-cli-trixie"
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.13.0
  # Committed secrets fail the pipeline before they ride along in a release; this repo mirrors to public GitHub.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/secret-detection@0.13.0
    inputs:
      image: "zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
  # The front page deploy layer: deploy/ is checked by PROCTOR against CREED's policy and must pass.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.13.0
    inputs:
      image: "php:8.5-cli-trixie@sha256:9236fd373d3bcda0659cf94838a744bd79791419292958963f8c6b34a0071554"
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --format=codequality
  # Accessibility: Preflight's a11y component serves site/ and checks every page with axe-core 4.14.1, light and
  # dark, at 320 and 1280 px, plus WCAG 1.4.10 reflow, at WCAG 2.2 AA. Its Playwright image comes from
  # mcr.microsoft.com, which the Dependency Proxy does not front, so it takes no image_prefix.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@0.13.0
    inputs:
      tier: full
      site_dir: site
      pages: ["**/*.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]

# Dependency caching: images already come through the Dependency Proxy, and
# every job that installs packages extends a cache under a fixed key, not a
# lock-file hash: Composer's and npm's caches are additive, so a lock
# change downloads only what changed instead of everything.
# The cache saves even when a job fails (when: always), so a dropped download
# still keeps every package that finished, and the retry fetches only the rest.
variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

.composer-cache:
  cache:
    key: composer
    paths: [.cache/composer/]
    when: always

.npm-cache:
  cache:
    key: npm
    paths: [.cache/npm/]
    when: always

wayneui-copies:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --working-dir=deploy --no-interaction --no-progress --prefer-dist
    - deploy/vendor/bin/proctor check --path=.

# On tag pipelines, composer ci runs PackageVersionTest, which fails when
# package.json's version does not match the tag, so npm can publish from it.
composer-ci:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# The JS presets run under npm test: pushes run Node 26, and the nightly and
# tag pipelines add 22 (the floor stays 22.13, from package.json engines) and
# 24, so a broken ESLint or Prettier preset fails the pipeline, not just a dev box.
npm-test:
  extends: .npm-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:26
  script:
    - npm ci
    - npm test

npm-test-matrix:
  extends: .npm-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:${NODE_MAJOR}
  parallel:
    matrix:
      - NODE_MAJOR: ['22', '24']
  rules:
    - if: '$PREFLIGHT_TIER == "full"'
  script:
    - npm ci
    - npm test

# docs/readme/ is committed because the deploy server cannot build, so this
# rebuilds the art in a temp folder and fails when it drifts: SVGs byte for
# byte, images by pixels within a small tolerance (arm64 CI vs amd64 dev boxes).
readme-art:
  extends: .npm-cache
  image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
  rules:
    - if: '$PREFLIGHT_TIER == "full"'
  script:
    - npm --prefix scripts/readme-art ci --no-audit --no-fund
    - node scripts/readme-art/build.mjs --check
