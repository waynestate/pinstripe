# Pinstripe's pipeline, built from the Preflight components on this GitLab.
# Pinned to Preflight 0.8.0. Never use ~latest.
# Pinstripe requires PHP ^8.3, so the test matrix starts at 8.3. The tests run
# Pint and PHPStan on fixtures, so a green php-test means the presets work.
# composer ci is the contract: every check runs from the "ci" script in composer.json.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.8.0
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      image: "php:${PHP_VERSION}-cli-trixie"
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.8.0
  # The front page deploy layer: deploy/ is checked by PROCTOR against CREED's policy and must pass.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.8.0
    inputs:
      image: "php:8.4-cli-trixie@sha256:9cf851bc2c1b37c3e59dfd677a3c3e56d485af5a47c93f629424bb039eafcb69"
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --format=codequality
  # Accessibility: Preflight's a11y component serves site/ and checks every page with axe-core 4.14.0, light and
  # dark, at 320 and 1280 px, plus WCAG 1.4.10 reflow, at WCAG 2.2 AA. Its Playwright image comes from
  # mcr.microsoft.com, which the Dependency Proxy does not front, so it takes no image_prefix.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@0.8.0
    inputs:
      site_dir: site
      pages: ["**/*.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]

# Dependency caching: images already come through the Dependency Proxy, and
# every job that installs packages extends a cache under a fixed key, not a
# lock-file hash: Composer's and npm's caches are additive, so a lock
# change downloads only what changed instead of everything.
# The cache saves even when a job fails (when: always), so a dropped download
# still keeps every package that finished, and the retry fetches only the rest.
variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

.composer-cache:
  cache:
    key: composer
    paths: [.cache/composer/]
    when: always

.npm-cache:
  cache:
    key: npm
    paths: [.cache/npm/]
    when: always

wayneui-copies:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --working-dir=deploy --no-interaction --no-progress --prefer-dist
    - deploy/vendor/bin/proctor check --path=.

# On tag pipelines, composer ci runs PackageVersionTest, which fails when
# package.json's version does not match the tag, so npm can publish from it.
composer-ci:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# The JS presets run under npm test on Node 22, 24 and 26 (the floor stays
# 22.13, from package.json engines), so a broken ESLint or Prettier preset
# fails the pipeline, not just a dev box.
npm-test:
  extends: .npm-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:${NODE_MAJOR}
  parallel:
    matrix:
      - NODE_MAJOR: ['22', '24', '26']
  script:
    - npm ci
    - npm test

# docs/readme/ is committed because the deploy server cannot build, so this
# rebuilds the art in a temp folder and fails when it drifts: SVGs byte for
# byte, images by pixels within a small tolerance (arm64 CI vs amd64 dev boxes).
readme-art:
  extends: .npm-cache
  image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
  script:
    - npm --prefix scripts/readme-art ci --no-audit --no-fund
    - node scripts/readme-art/build.mjs --check
