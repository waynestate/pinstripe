# The GitHub mirror's CI. Every check lives in the `ci` script in composer.json;
# this file only says where and on which PHP versions to run it.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

permissions:
  contents: read

jobs:
  ci:
    # Pinned by tag, not branch: a workflow can only call a reusable workflow
    # from another repository by tag or full SHA. 0.8.0 is the newest Preflight
    # tag on the public mirror (checked 2026-11-11).
    uses: waynestate/preflight/.github/workflows/php-package.yml@0.8.0
    with:
      php-versions: '["8.3","8.4","8.5"]'
      ci-command: composer ci

  # The JS presets run under npm test on Node 22, 24 and 26, the same job as
  # on GitLab (the floor stays 22.13, from package.json engines).
  npm-test:
    runs-on: ubuntu-latest
    container: node:${{ matrix.node }}
    strategy:
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm test
