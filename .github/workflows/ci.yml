# The GitHub mirror's CI. Every check lives in the `ci` script in composer.json;
# this file only says where and on which PHP versions to run it.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

permissions:
  contents: read

jobs:
  ci:
    # pin to a Preflight tag at its first GitHub release
    uses: waynestate/preflight/.github/workflows/php-package.yml@65711c350bd0ddf637f0933482d7bdae2a9b3c3b
    with:
      php-versions: '["8.3","8.4","8.5"]'
      ci-command: composer ci

  # The JS presets run under npm test on Node 22, the same job as on GitLab.
  npm-test:
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm test
